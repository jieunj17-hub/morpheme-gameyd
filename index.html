<html lang="ko">
<head>
<script>

<meta charset="UTF-8">
<title>형태소 슬라이서 - 심화 문장 게임</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<style>
:root {
  --wrks-viz-font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --wrks-viz-primary: #2563eb;
  --wrks-viz-boss: #dc2626;
  --wrks-viz-bg: #ffffff;
  --wrks-viz-fg: #111827;
  --wrks-viz-border: #d1d5db;
  --wrks-viz-radius: 8px;
  --wrks-viz-space-1: 4px;
  --wrks-viz-space-2: 8px;
  --wrks-viz-space-3: 12px;
  --wrks-viz-space-4: 16px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--wrks-viz-font-family);
  background: var(--wrks-viz-bg);
  color: var(--wrks-viz-fg);
  padding: var(--wrks-viz-space-4);
}
.container {
  max-width: 760px;
  margin: 0 auto;
}
h1 {
  font-size: 20px;
  margin-bottom: var(--wrks-viz-space-2);
  letter-spacing: -0.3px;
}
.subtitle {
  font-size: 13px;
  color: #6b7280;
  margin-bottom: var(--wrks-viz-space-4);
}
.hud {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: var(--wrks-viz-space-2);
  margin-bottom: var(--wrks-viz-space-3);
}
.hud-cell {
  border: 1px solid var(--wrks-viz-border);
  border-radius: var(--wrks-viz-radius);
  padding: var(--wrks-viz-space-2) var(--wrks-viz-space-3);
}
.hud-label {
  font-size: 11px;
  color: #6b7280;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.hud-value {
  font-size: 22px;
  font-weight: 600;
  margin-top: 2px;
}
.stage {
  border: 1px solid var(--wrks-viz-border);
  border-radius: var(--wrks-viz-radius);
  padding: var(--wrks-viz-space-4);
  min-height: 220px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-bottom: var(--wrks-viz-space-3);
  position: relative;
}
.stage.boss-theme {
  border-color: #fca5a5;
  background: #fff5f5;
}
.hint {
  position: absolute;
  top: var(--wrks-viz-space-3);
  left: var(--wrks-viz-space-3);
  font-size: 12px;
  color: #6b7280;
  font-weight: 600;
}
.word-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
  gap: 0;
  font-size: 32px;
  font-weight: 700;
  letter-spacing: 0;
  user-select: none;
  line-height: 1.8;
}
.char {
  padding: 2px 6px;
  border-radius: 4px;
  transition: background 0.15s;
}
.gap {
  width: 16px;
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
}
.gap::before {
  content: "";
  display: block;
  width: 2px;
  height: 50%;
  background: transparent;
  transition: background 0.15s;
}
.gap:hover::before {
  background: #d1d5db;
}
.gap.cut::before {
  background: var(--wrks-viz-primary);
  width: 3px;
  height: 85%;
}
.gap.correct::before {
  background: #16a34a;
  width: 3px;
  height: 85%;
}
.gap.wrong::before {
  background: #dc2626;
  width: 3px;
  height: 85%;
}
.gap.missed::before {
  background: #f59e0b;
  width: 3px;
  height: 85%;
}

/* 주관식 입력 폼 (보스 스테이지 전용) */
.subjective-box {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  width: 100%;
  margin-top: 10px;
}
.subjective-box.active { display: flex; }
.subjective-box input {
  font-size: 18px;
  padding: 10px 14px;
  border: 2px solid #fca5a5;
  border-radius: 8px;
  text-align: center;
  width: 85%;
  max-width: 380px;
  outline: none;
}
.subjective-box input:focus { border-color: var(--wrks-viz-boss); }

.feedback {
  margin-top: var(--wrks-viz-space-3);
  font-size: 14px;
  min-height: 42px;
  text-align: center;
  padding: var(--wrks-viz-space-2);
  width: 100%;
}
.feedback.ok { color: #16a34a; }
.feedback.ng { color: #dc2626; }

.answer-row {
  font-size: 15px;
  color: #374151;
  margin-top: var(--wrks-viz-space-2);
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  align-items: flex-start;
  gap: var(--wrks-viz-space-1);
}
.answer-row .m-box {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  padding: 6px 10px;
  border: 1px solid var(--wrks-viz-border);
  border-radius: 4px;
  background: #f9fafb;
  min-width: 45px;
  margin-bottom: 4px;
}
.answer-row .m-text {
  font-weight: 600;
  font-size: 15px;
}
.answer-row .m-type {
  font-size: 11px;
  color: #6b7280;
  margin-top: 2px;
  white-space: nowrap;
}
.answer-row .m-plus {
  align-self: center;
  color: #9ca3af;
  font-weight: 600;
  padding: 0 2px;
}

.controls {
  display: flex;
  gap: var(--wrks-viz-space-2);
  justify-content: center;
}
button {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: var(--wrks-viz-radius);
  border: 1px solid var(--wrks-viz-border);
  background: var(--wrks-viz-bg);
  color: var(--wrks-viz-fg);
  cursor: pointer;
  transition: background 0.15s;
}
button:hover:not(:disabled) {
  background: #f3f4f6;
}
button.primary {
  background: var(--wrks-viz-primary);
  color: #ffffff;
  border-color: var(--wrks-viz-primary);
}
button.primary:hover:not(:disabled) {
  background: #1d4ed8;
}
button.boss {
  background: var(--wrks-viz-boss);
  color: #ffffff;
  border-color: var(--wrks-viz-boss);
}
button.boss:hover:not(:disabled) {
  background: #b91c1c;
}
button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.legend {
  margin-top: var(--wrks-viz-space-3);
  font-size: 12px;
  color: #6b7280;
  text-align: center;
}
.legend span {
  display: inline-block;
  margin: 0 var(--wrks-viz-space-2);
}
.legend-dot {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
  vertical-align: middle;
  margin-right: 4px;
}

/* 기록 리포트 카드 */
.report-card {
  width: 100%;
  text-align: left;
  background: #f9fafb;
  border: 1px solid var(--wrks-viz-border);
  border-radius: var(--wrks-viz-radius);
  padding: 16px;
  margin-top: 12px;
  color: #111827;
}
.report-title {
  font-size: 16px;
  font-weight: 700;
  margin-bottom: 12px;
  color: var(--wrks-viz-primary);
  text-align: center;
}
.report-stats {
  display: flex;
  justify-content: space-around;
  margin-bottom: 16px;
  background: #ffffff;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #e5e7eb;
}
.stat-item { text-align: center; }
.stat-item .lbl { font-size: 11px; color: #6b7280; }
.stat-item .val { font-size: 18px; font-weight: 700; color: #1f2937; }

.record-list {
  list-style: none;
  max-height: 150px;
  overflow-y: auto;
  border-top: 1px dashed var(--wrks-viz-border);
  padding-top: 8px;
}
.record-item {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  padding: 4px 8px;
  border-bottom: 1px solid #f3f4f6;
}
.record-item.latest {
  font-weight: 700;
  background: #eff6ff;
  color: var(--wrks-viz-primary);
  border-radius: 4px;
}
</style>
</head>
<body>
<div class="container">
  <h1>형태소 슬라이서 - 문장 심화 스테이지</h1>
  <div class="subtitle">글자 사이를 마우스로 클릭해 문장을 형태소 단위로 슬라이스하세요!</div>

  <div class="hud">
    <div class="hud-cell">
      <div class="hud-label">문제</div>
      <div class="hud-value" id="qnum">1 / 15</div>
    </div>
    <div class="hud-cell">
      <div class="hud-label">점수</div>
      <div class="hud-value" id="score">0</div>
    </div>
    <div class="hud-cell">
      <div class="hud-label">연속 정답</div>
      <div class="hud-value" id="combo">0</div>
    </div>
    <div class="hud-cell">
      <div class="hud-label">시도 회차</div>
      <div class="hud-value" id="playCount">1차</div>
    </div>
  </div>

  <div class="stage" id="stageCard">
    <div class="hint" id="hint">글자 사이를 클릭하세요</div>
    <div class="word-row" id="word"></div>
    
    <!-- 보스 스테이지 서술형 입력창 -->
    <div class="subjective-box" id="subjectiveArea">
      <div style="font-weight:700; color:#991b1b; font-size:15px;">👾 보스 특수 문제: '달렸다' 속에 숨은 형태소를 직접 써보세요!</div>
      <div style="font-size:13px; color:#7f1d1d;">입력 방식 예시: <b>달리/었/다</b> 또는 <b>달리- / -었- / -다</b></div>
      <input type="text" id="subjectiveInput" placeholder="정답 입력 (예: 달리/었/다)">
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

  <div class="controls">
    <button id="checkBtn" class="primary">잘라!</button>
    <button id="nextBtn" disabled>다음 문제</button>
    <button id="resetBtn">처음부터 다시</button>
  </div>

  <div class="legend" id="legend">
    <span><span class="legend-dot" style="background:#2563eb"></span>내가 자른 곳</span>
    <span><span class="legend-dot" style="background:#16a34a"></span>정답</span>
    <span><span class="legend-dot" style="background:#dc2626"></span>오답</span>
    <span><span class="legend-dot" style="background:#f59e0b"></span>놓친 경계</span>
  </div>
</div>

<script>
const problems = [
  // ===== 1차시: 기초 복습 단어 =====
  { mode: "click", word: "밝다", cuts: [1], display: ["밝-","-다"], types: ["용언 어간","용언 어미"], level: "기초", hint: "밝(어근) + 다(어미)" },
  { mode: "click", word: "봄바람", cuts: [1], display: ["봄","바람"], types: ["어근","어근"], level: "기초", hint: "봄(명사) + 바람(명사)" },
  { mode: "click", word: "풋사과", cuts: [1], display: ["풋-","사과"], types: ["접두사","어근"], level: "기초", hint: "풋-(접사) + 사과 = 파생어" },
  { mode: "click", word: "무지개", cuts: [], display: ["무지개"], types: ["단일어"], level: "기초", hint: "함정! 무지개는 단일어" },

  // ===== 2차시: 형태소 심화 문장 스테이지 =====
  { 
    mode: "click",
    word: "새 신을 신고 달리고 있다.", 
    cuts: [1, 2, 3, 5, 6, 7, 9, 10, 12, 13], 
    display: ["새", "신", "을", "신-", "-고", "달리-", "-고", "있-", "-다"], 
    types: ["관형사", "명사", "조사", "어간", "어미", "어간", "어미", "어간", "어미"], 
    level: "심화 문장 1", 
    hint: "새 / 신 / 을 / 신 / 고 / 달 / 리 / 고 / 있 / 다" 
  },
  { 
    mode: "click",
    word: "풋사과를 아주 맛있게 먹었어.", 
    cuts: [1, 3, 4, 6, 7, 8, 10, 11, 13, 14], 
    display: ["풋-", "사과", "를", "아주", "맛", "-있-", "-게", "먹-", "-었-", "-어"], 
    types: ["접두사", "명사", "조사", "부사", "어근", "어간", "어미", "어간", "선어말어미", "어말어미"], 
    level: "심화 문장 2", 
    hint: "풋 / 사 / 과 / 를 / 아 / 주 / 맛 / 있 / 게 / 먹 / 었 / 어" 
  },
  { 
    mode: "click",
    word: "아침에 맨발로 강가를 건너고 있다.", 
    cuts: [2, 3, 4, 6, 7, 8, 10, 11, 13, 14, 16, 17], 
    display: ["아침", "에", "맨-", "발", "로", "강", "가", "를", "건너-", "-고", "있-", "-다"], 
    types: ["명사", "조사", "접두사", "명사", "조사", "명사", "명사", "조사", "어간", "어미", "어간", "어미"], 
    level: "심화 문장 3", 
    hint: "아 / 침 / 에 / 맨 / 발 / 로 / 강 / 가 / 를 / 건 / 너 / 고 / 있 / 다" 
  },
  { 
    mode: "click",
    word: "그분은 아주 환하게 웃었다.", 
    cuts: [1, 2, 3, 5, 6, 8, 9, 10, 12, 13], 
    display: ["그", "분", "은", "아주", "환하-", "-게", "웃-", "-었-", "-다"], 
    types: ["관형사", "의존명사", "조사", "부사", "어간", "어미", "어간", "선어말어미", "어말어미"], 
    level: "심화 문장 4", 
    hint: "그 / 분 / 은 / 아 / 주 / 환 / 하 / 게 / 웃 / 었 / 다" 
  },

  // ===== 2차시 심화 보스 문제 (서술형) =====
  { 
    mode: "subjective",
    word: "새 신을 신고 길을 달렸다.",
    targetWord: "달렸다",
    keywords: ["달리/었/다", "달리- / -었- / -다", "달리 / 었 / 다", "달리,-었-,-다", "달리,었,다"],
    display: ["새", "신", "을", "신-", "-고", "길", "을", "달리-", "-었-", "-다"],
    types: ["관형사", "명사", "조사", "어간", "어미", "명사", "조사", "어간", "선어말어미", "어말어미"],
    level: "심화 보스 👾",
    hint: "'달렸다' 속 어간('달리-')과 과거시제 어미('-었-')의 원형을 밝혀 쓰세요!"
  }
];

let sessionRecords = [];
let state = {
  idx: 0,
  score: 0,
  combo: 0,
  cuts: new Set(),
  checked: false
};

const wordEl = document.getElementById("word");
const feedbackEl = document.getElementById("feedback");
const qnumEl = document.getElementById("qnum");
const scoreEl = document.getElementById("score");
const comboEl = document.getElementById("combo");
const playCountEl = document.getElementById("playCount");
const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");
const hintEl = document.getElementById("hint");
const legendEl = document.getElementById("legend");
const stageCard = document.getElementById("stageCard");
const subjectiveArea = document.getElementById("subjectiveArea");
const subjectiveInput = document.getElementById("subjectiveInput");

function render() {
  const p = problems[state.idx];
  wordEl.style.display = "flex";
  wordEl.innerHTML = "";
  
  if (p.mode === "click") {
    stageCard.className = "stage";
    checkBtn.className = "primary";
    checkBtn.innerText = "잘라!";
    subjectiveArea.classList.remove("active");

    const chars = p.word.split("");
    for (let i = 0; i < chars.length; i++) {
      if (i > 0) {
        const gap = document.createElement("div");
        gap.className = "gap";
        gap.dataset.pos = i;
        if (state.cuts.has(i)) {
          gap.classList.add("cut");
        }
        if (state.checked) {
          const isCorrectCut = p.cuts.includes(i);
          const userCut = state.cuts.has(i);
          if (userCut && isCorrectCut) {
            gap.classList.remove("cut");
            gap.classList.add("correct");
          } else if (userCut && !isCorrectCut) {
            gap.classList.remove("cut");
            gap.classList.add("wrong");
          } else if (!userCut && isCorrectCut) {
            gap.classList.add("missed");
          }
        }
        if (!state.checked) {
          gap.addEventListener("click", () => toggleCut(i));
        }
        wordEl.appendChild(gap);
      }
      const c = document.createElement("div");
      c.className = "char";
      c.textContent = chars[i];
      wordEl.appendChild(c);
    }
  } else {
    stageCard.className = "stage boss-theme";
    checkBtn.className = "boss";
    checkBtn.innerText = "보스 공격 (제출)";
    subjectiveArea.classList.add("active");
    subjectiveInput.value = "";
    wordEl.innerHTML = `<span style="color:#b91c1c; font-size:28px;">"${p.word}"</span>`;
  }

  qnumEl.textContent = (state.idx + 1) + " / " + problems.length;
  scoreEl.textContent = state.score;
  comboEl.textContent = state.combo;
  playCountEl.textContent = (sessionRecords.length + 1) + "차";
  hintEl.textContent = `[${p.level}] ${p.hint}`;
  legendEl.style.display = (p.mode === "click") ? "block" : "none";
}

function toggleCut(pos) {
  if (state.cuts.has(pos)) {
    state.cuts.delete(pos);
  } else {
    state.cuts.add(pos);
  }
  render();
}

function renderAnswer(p) {
  let html = "<div class='answer-row'>";
  for (let i = 0; i < p.display.length; i++) {
    html += "<div class='m-box'>";
    html += "<div class='m-text'>" + p.display[i] + "</div>";
    html += "<div class='m-type'>" + p.types[i] + "</div>";
    html += "</div>";
    if (i < p.display.length - 1) html += "<span class='m-plus'>+</span>";
  }
  html += "</div>";
  return html;
}

function check() {
  const p = problems[state.idx];
  state.checked = true;

  if (p.mode === "click") {
    const correct = new Set(p.cuts);
    const user = state.cuts;
    let hits = 0, misses = 0, wrongs = 0;
    correct.forEach(c => { if (user.has(c)) hits++; else misses++; });
    user.forEach(u => { if (!correct.has(u)) wrongs++; });

    const perfect = misses === 0 && wrongs === 0;
    if (perfect) {
      state.combo++;
      const bonus = state.combo >= 3 ? 50 : 0;
      const gained = 100 + bonus;
      state.score += gained;
      feedbackEl.className = "feedback ok";
      let msg = "정답! +" + gained + "점";
      if (bonus) msg += " (연속 " + state.combo + "번째 보너스!)";
      msg += renderAnswer(p);
      feedbackEl.innerHTML = msg;
    } else {
      state.combo = 0;
      feedbackEl.className = "feedback ng";
      let msg = "아쉬워요. ";
      if (misses) msg += "놓친 경계 " + misses + "곳";
      if (misses && wrongs) msg += ", ";
      if (wrongs) msg += "잘못 자른 곳 " + wrongs + "곳";
      msg += "<div style='margin-top:8px'>정답 해설:</div>" + renderAnswer(p);
      feedbackEl.innerHTML = msg;
    }
  } else {
    const val = subjectiveInput.value.trim().replace(/\s+/g, "");
    const isCorrect = p.keywords.some(k => val === k.replace(/\s+/g, ""));

    if (isCorrect) {
      state.combo++;
      const gained = 300;
      state.score += gained;
      feedbackEl.className = "feedback ok";
      feedbackEl.innerHTML = `🎉 <b>보스 클리어 성공! (+${gained}점)</b><br>'<b>달렸다</b>' 속 3개의 형태소(<b>달리-</b> + <b>-었-</b> + <b>-다</b>)를 정확하게 추론해냈습니다!` + renderAnswer(p);
    } else {
      state.combo = 0;
      feedbackEl.className = "feedback ng";
      feedbackEl.innerHTML = `❌ <b>보스 공격 실패!</b><br>정답 표기 방식: <b>달리/었/다</b> ('달리-' + '-었-' + '-다')` + renderAnswer(p);
    }
  }

  checkBtn.disabled = true;
  nextBtn.disabled = false;
  render();
}

function next() {
  if (state.idx < problems.length - 1) {
    state.idx++;
    state.cuts = new Set();
    state.checked = false;
    feedbackEl.textContent = "";
    feedbackEl.className = "feedback";
    checkBtn.disabled = false;
    nextBtn.disabled = true;
    render();
  } else {
    showFinalResult();
  }
}

function showFinalResult() {
  const currentTry = sessionRecords.length + 1;
  sessionRecords.push({
    tryCount: currentTry,
    score: state.score,
    date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
  });

  const maxScore = Math.max(...sessionRecords.map(r => r.score));
  
  wordEl.style.display = "none";
  subjectiveArea.classList.remove("active");
  hintEl.textContent = "🏆 게임 종료!";
  legendEl.style.display = "none";

  feedbackEl.className = "feedback ok";
  
  let reportHtml = `
    <div style="font-size:20px; font-weight:700; margin-bottom:8px;">축하합니다! 심화 문장 스테이지까지 모두 정복했습니다.</div>
    <div class="report-card">
      <div class="report-title"> 🏆 누적 플레이 성적 </div>
      <div class="report-stats">
        <div class="stat-item">
          <div class="lbl">이번 회차 점수</div>
          <div class="val" style="color:#2563eb;">${state.score}점</div>
        </div>
        <div class="stat-item">
          <div class="lbl">최고 점수</div>
          <div class="val" style="color:#16a34a;">${maxScore}점</div>
        </div>
        <div class="stat-item">
          <div class="lbl">총 도전 횟수</div>
          <div class="val">${sessionRecords.length}회차</div>
        </div>
      </div>
      <div style="font-size:12px; font-weight:600; color:#4b5563; margin-bottom:6px;"> 📜 누적 플레이 기록</div>
      <ul class="record-list">
  `;

  [...sessionRecords].reverse().forEach(rec => {
    const isLatest = rec.tryCount === currentTry;
    reportHtml += `
      <li class="record-item ${isLatest ? 'latest' : ''}">
        <span>${rec.tryCount}차 시도 (${rec.date}) ${isLatest ? '<b>[NEW]</b>' : ''}</span>
        <span><b>${rec.score}점</b></span>
      </li>
    `;
  });

  reportHtml += `
      </ul>
    </div>
  `;

  feedbackEl.innerHTML = reportHtml;
  checkBtn.disabled = true;
  nextBtn.disabled = true;
}

function reset() {
  state = { idx: 0, score: 0, combo: 0, cuts: new Set(), checked: false };
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  checkBtn.disabled = false;
  nextBtn.disabled = true;
  render();
}

checkBtn.addEventListener("click", check);
nextBtn.addEventListener("click", next);
resetBtn.addEventListener("click", reset);

render();
</script>
</body>
</html>
